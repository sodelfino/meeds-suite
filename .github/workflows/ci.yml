name: verificar

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup do Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador para testes de interface
        run: npx playwright install --with-deps --only-shell chromium

      - name: Testar rolagem e acesso aos exames
        run: npm run teste:exames-ui

      - name: Testar instalação guiada
        run: node tests/instalacao-guiada.test.js

      - name: Verificar (build --check, sincronizações, testes e lint)
        run: npm run verificar

      - name: Falhar se o CI alterou algum arquivo versionado
        run: |
          git diff --exit-code || (echo "❌ npm run verificar alterou arquivos versionados. Corrija a divergência de versão antes de continuar." && exit 1)

      - name: Reconstruir e conferir artefatos versionados
        run: |
          npm run build
          git diff --exit-code
